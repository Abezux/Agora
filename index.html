<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Agora — Digital Ledger for Modern Merchants</title>
    <meta
      name="description"
      content="Agora connects your counter register directly to inventory counts, gold stock warnings, and daily net revenue reports. Built for retail shop owners."
    />
    <link rel="canonical" href="https://agora-pos.app/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agora-pos.app/" />
    <meta property="og:title" content="Agora — Digital Ledger for Modern Merchants" />
    <meta
      property="og:description"
      content="Stop sales and stock from drifting apart in a paper notebook. Tap-to-sell register, gold stock warnings, and instant net revenue reports."

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://agora-pos.app/" />
    <meta property="twitter:title" content="Agora — Digital Ledger for Modern Merchants" />
    <meta
      property="twitter:description"
      content="Stop sales and stock from drifting apart in a paper notebook. Tap-to-sell register, gold stock warnings, and instant net revenue reports."
    />
    <meta property="twitter:image" content="https://agora-pos.app/og-preview-placeholder.png" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agora" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
  </head>
  <body class="bg-[#FAF6EE] text-[#211D1A] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
